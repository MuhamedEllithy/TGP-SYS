name: Backend foundation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Require resolved dependency locks
        run: test -s go.sum && test -s tools/package-lock.json
      - uses: actions/setup-go@v5.5.0
        with:
          go-version: '1.26.10'
          cache: true
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - name: Dedicated ephemeral-host Phase 0 checks
        run: make verify-phase0
      - name: Stop only dedicated PostgreSQL without deleting data
        if: always()
        run: |
          if [ -f .env ]; then
            docker compose --env-file .env -f deployments/local/compose.yaml stop postgres
          fi
